[build]
  # Skip builds triggered by Git pushes; allow builds triggered via Netlify build hooks.
  # Exit 0 = skip, non-zero = build. $BUILD_TRIGGER is "push" for Git, "api" for hooks.
  ignore = "[ \"$BUILD_TRIGGER\" != 'api' ]"

# Branches that should always build on every push (no ignore rule).
[context.wenoptieverence]
  ignore = "false"

[context.wenopticooley]
  ignore = "false"

[context.wenoptiHCA]
  ignore = "false"
